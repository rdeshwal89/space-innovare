<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gallery with Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- 5. REAL PROJECTS GALLERY -->
    <section id="portfolio" class="py-16 bg-slate-100/80 border-y border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between mb-8 gap-4">
                <div>
                    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-bold uppercase tracking-wider">Real Execution</span>
                    <h2 class="text-2xl sm:text-4xl font-black text-slate-950 mt-2">हमारे रियल प्रोजेक्ट्स & वीडियो</h2>
                    <p id="admin-status-indicator" class="text-xs text-slate-500 mt-1">हमारे द्वारा पूरे किए गए कार्य का वास्तविक विवरण</p>
                </div>
                
                <!-- Open Admin Panel Button -->
                <button onclick="openAdminModal()" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center gap-2 self-start sm:self-auto shadow-md transition">
                    <i data-lucide="sliders-horizontal" class="w-4 h-4 text-amber-500"></i>
                    <span>Manage / Add / Replace Projects</span>
                </button>
            </div>

            <!-- Filter Pills -->
            <div class="flex gap-2 overflow-x-auto pb-3 mb-6" id="gallery-tabs-container">
                <button onclick="filterGallery('all', this)" class="gallery-tab active shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition">सभी (All)</button>
                <button onclick="filterGallery('interior', this)" class="gallery-tab shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-300 text-slate-700 hover:border-slate-400 transition">लक्ज़री इंटीरियर</button>
                <button onclick="filterGallery('woodwork', this)" class="gallery-tab shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-300 text-slate-700 hover:border-slate-400 transition">डोर्स & वॉर्डरोब</button>
                <button onclick="filterGallery('3d', this)" class="gallery-tab shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-300 text-slate-700 hover:border-slate-400 transition">3D एलिवेशन</button>
                <button onclick="filterGallery('video', this)" class="gallery-tab shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-300 text-slate-700 hover:border-slate-400 transition">वीडियो</button>
            </div>

            <!-- Dynamic Project Grid -->
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- JavaScript से ऑटोमैटिक लोड होगा -->
            </div>
        </div>
    </section>

    <!-- ADMIN MODAL (Add / Edit / Replace Projects) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Step 1: Admin Password Check -->
            <div id="admin-auth-section">
                <h3 class="text-lg font-bold text-slate-900 mb-2">एडमिन ऑथेंटिकेशन</h3>
                <p class="text-xs text-slate-500 mb-4">बदलाव करने के लिए कृपया एडमिन पासवर्ड/PIN डालें (Default: 1234)</p>
                <input type="password" id="admin-pin" placeholder="Enter PIN (1234)" class="w-full border rounded-xl px-3 py-2 text-sm mb-3">
                <button onclick="verifyAdmin()" class="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-sm">लॉगिन करें</button>
            </div>

            <!-- Step 2: Add/Edit Project Form (Unlocked after login) -->
            <div id="admin-form-section" class="hidden">
                <h3 id="form-title" class="text-lg font-bold text-slate-900 mb-4">नया प्रोजेक्ट जोड़ें / बदलें</h3>
                
                <input type="hidden" id="edit-index" value="-1">

                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-slate-700">प्रोजेक्ट का नाम / टाइटल</label>
                        <input type="text" id="proj-title" placeholder="जैसे: 3BHK Luxury Interior" class="w-full border rounded-xl px-3 py-2 text-sm mt-1">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-700">कैटेगरी (Category)</label>
                        <select id="proj-category" class="w-full border rounded-xl px-3 py-2 text-sm mt-1">
                            <option value="interior">लक्ज़री इंटीरियर</option>
                            <option value="woodwork">डोर्स & वॉर्डरोब</option>
                            <option value="3d">3D एलिवेशन</option>
                            <option value="video">वीडियो</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-700">टाइप (Media Type)</label>
                        <select id="proj-type" class="w-full border rounded-xl px-3 py-2 text-sm mt-1" onchange="toggleMediaInput()">
                            <option value="image">फोटो (Image)</option>
                            <option value="video">वीडियो (YouTube / MP4 URL)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-700">इमेज / वीडियो URL या फाइल</label>
                        <input type="text" id="proj-url" placeholder="https://... (Image or Video URL)" class="w-full border rounded-xl px-3 py-2 text-sm mt-1">
                    </div>
                </div>

                <div class="flex gap-2 mt-5">
                    <button onclick="saveProject()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-sm transition">सेव करें (Save)</button>
                    <button onclick="resetAdminForm()" class="px-4 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-sm">कैंसल</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Projects (यदि डेटाबेस खाली हो)
        const defaultProjects = [
            {
                id: 1,
                title: "मॉडर्न लिविंग रूम इंटीरियर",
                category: "interior",
                type: "image",
                url: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                title: "मास्टर बेडरूम वॉर्डरोब वर्क",
                category: "woodwork",
                type: "image",
                url: "https://images.unsplash.com/photo-1558997519-83ea9252edf8?w=800&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                title: "विला वॉकथ्रू वीडियो टूर",
                category: "video",
                type: "video",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        // 1. Load Data from LocalStorage or Default
        let projects = JSON.parse(localStorage.getItem("gallery_projects")) || defaultProjects;
        let currentFilter = 'all';
        let isAdminLoggedIn = false;

        function saveToStorage() {
            localStorage.setItem("gallery_projects", JSON.stringify(projects));
            renderGallery();
        }

        // 2. Render Gallery Grid
        function renderGallery() {
            const grid = document.getElementById("gallery-grid");
            grid.innerHTML = "";

            const filtered = currentFilter === 'all' 
                ? projects 
                : projects.filter(p => p.category === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">इस कैटेगरी में कोई आइटम नहीं है।</div>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach((p, index) => {
                const realIndex = projects.findIndex(item => item.id === p.id);
                
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col";

                // Media Container (Image or Video)
                let mediaHtml = "";
                if (p.type === "video") {
                    mediaHtml = `
                        <div class="relative w-full aspect-video bg-black">
                            <iframe class="w-full h-full" src="${p.url}" frameborder="0" allowfullscreen></iframe>
                        </div>`;
                } else {
                    mediaHtml = `
                        <div class="relative w-full h-48 sm:h-56 bg-slate-200 overflow-hidden">
                            <img src="${p.url}" alt="${p.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        </div>`;
                }

                // Admin Controls (Edit / Replace & Delete)
                const adminControls = isAdminLoggedIn ? `
                    <div class="flex gap-2 mt-3 pt-3 border-t border-slate-100">
                        <button onclick="editProject(${realIndex})" class="text-xs text-blue-600 font-bold flex items-center gap-1 hover:underline">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> बदलें / Replace
                        </button>
                        <button onclick="deleteProject(${realIndex})" class="text-xs text-rose-600 font-bold flex items-center gap-1 hover:underline ml-auto">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> डिलीट
                        </button>
                    </div>
                ` : '';

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md">${p.category}</span>
                            <h4 class="font-bold text-slate-900 text-sm mt-1.5">${p.title}</h4>
                        </div>
                        ${adminControls}
                    </div>
                `;

                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // 3. Filter Tabs
        function filterGallery(category, btn) {
            currentFilter = category;
            document.querySelectorAll(".gallery-tab").forEach(tab => {
                tab.className = "gallery-tab shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-300 text-slate-700 hover:border-slate-400 transition";
            });
            btn.className = "gallery-tab active shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition";
            renderGallery();
        }

        // 4. Admin Functions
        function openAdminModal() {
            document.getElementById("admin-modal").classList.remove("hidden");
            if (isAdminLoggedIn) {
                document.getElementById("admin-auth-section").classList.add("hidden");
                document.getElementById("admin-form-section").classList.remove("hidden");
            }
            lucide.createIcons();
        }

        function closeAdminModal() {
            document.getElementById("admin-modal").classList.add("hidden");
            resetAdminForm();
        }

        function verifyAdmin() {
            const pin = document.getElementById("admin-pin").value;
            if (pin === "1234") { // डेमो पिन: 1234
                isAdminLoggedIn = true;
                document.getElementById("admin-auth-section").classList.add("hidden");
                document.getElementById("admin-form-section").classList.remove("hidden");
                renderGallery();
            } else {
                alert("गलत पासवर्ड! कृपया सही पिन डालें।");
            }
        }

        function saveProject() {
            const editIdx = parseInt(document.getElementById("edit-index").value);
            const title = document.getElementById("proj-title").value.trim();
            const category = document.getElementById("proj-category").value;
            const type = document.getElementById("proj-type").value;
            const url = document.getElementById("proj-url").value.trim();

            if (!title || !url) {
                alert("कृपया टाइटल और URL दोनों भरें!");
                return;
            }

            if (editIdx >= 0) {
                // Replace / Edit existing
                projects[editIdx] = { id: projects[editIdx].id, title, category, type, url };
            } else {
                // Add new
                projects.unshift({ id: Date.now(), title, category, type, url });
            }

            saveToStorage();
            closeAdminModal();
        }

        function editProject(index) {
            const p = projects[index];
            document.getElementById("edit-index").value = index;
            document.getElementById("proj-title").value = p.title;
            document.getElementById("proj-category").value = p.category;
            document.getElementById("proj-type").value = p.type;
            document.getElementById("proj-url").value = p.url;
            document.getElementById("form-title").innerText = "प्रोजेक्ट बदलें (Replace Media)";
            openAdminModal();
        }

        function deleteProject(index) {
            if (confirm("क्या आप वाकई इस प्रोजेक्ट को हटाना चाहते हैं?")) {
                projects.splice(index, 1);
                saveToStorage();
            }
        }

        function resetAdminForm() {
            document.getElementById("edit-index").value = "-1";
            document.getElementById("proj-title").value = "";
            document.getElementById("proj-url").value = "";
            document.getElementById("form-title").innerText = "नया प्रोजेक्ट जोड़ें";
        }

        // Initialize on load
        renderGallery();
        lucide.createIcons();
    </script>
</body>
</html>
